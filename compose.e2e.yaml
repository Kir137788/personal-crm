name: personal-crm-e2e

services:
  postgres-e2e:
    image: postgres:18
    environment:
      POSTGRES_DB: personal_crm_e2e
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_crm_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_e2e_data:
